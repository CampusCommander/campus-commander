name: Phase 3 candidate delivery
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
permissions:
  contents: read
env:
  CC_SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/phase-3-candidate.yml@${{ github.ref }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require laboratory mode
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          if [ "$BUILD_MODE" != lab ]; then
            echo 'Full Phase 3 qualification is not available.' >&2
            exit 1
          fi
      - name: Require the trusted review delivery branch
        run: test "$GITHUB_REF" = refs/heads/codex/cc-60-review-delivery
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm exec nx run api-e2e:hybrid-fixture-test
      - run: npm exec nx run api-e2e:navigation-fixture-test
      - run: npm exec nx run-many -- -t build,lint,test -p deployment,frontend,api,worker,application-contracts
        env:
          NX_NO_CLOUD: 'true'
      - run: npm exec nx run-many -- -t bootstrap-test,redis-test,postgres-test,storage-test,release-test,installer-test,kubernetes-test,profiles-test,qualification-test,operations-test -p deployment
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - api
          - worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npm exec nx run ${{ matrix.service }}:image
        env:
          NX_NO_CLOUD: 'true'
          CC_IMAGE_VERSION: phase-3-candidate-${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Scan the exact runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p candidate "$RUNNER_TEMP/cc-tools"
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz --output "$RUNNER_TEMP/cc-tools/trivy.tar.gz"
          printf '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  %s\n' "$RUNNER_TEMP/cc-tools/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cc-tools/trivy.tar.gz" -C "$RUNNER_TEMP/cc-tools" trivy
          "$RUNNER_TEMP/cc-tools/trivy" image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --format json --output "candidate/${SERVICE}.vulnerabilities.json" "campus-commander/${SERVICE}:cc-6"
      - name: Publish immutable candidate reference
        id: publish
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          candidate_image="ghcr.io/campuscommander/campus-commander-${SERVICE}:phase-3-candidate-${GITHUB_SHA}"
          docker tag "campus-commander/${SERVICE}:cc-6" "$candidate_image"
          docker push "$candidate_image"
          digest="$(docker buildx imagetools inspect "$candidate_image" --format '{{.Manifest.Digest}}')"
          reference="${candidate_image%%:phase-3-candidate-*}@${digest}"
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          mkdir -p candidate
          printf '%s\n' "$reference" > "candidate/${SERVICE}.reference"
          cosign sign --yes "$reference"
          cosign verify "$reference" --certificate-identity="${CC_SIGNING_IDENTITY}" --certificate-oidc-issuer=https://token.actions.githubusercontent.com > "candidate/${SERVICE}.verification.json"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.publish.outputs.reference }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: candidate/${{ matrix.service }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.service }}
          path: candidate/
          if-no-files-found: error
  application:
    outputs:
      evidence-artifact-id: ${{ steps.application-evidence.outputs.artifact-id }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.7.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          merge-multiple: true
          path: image-evidence
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm exec nx run deployment:build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Prepare published image references
        run: |
          for service in api frontend worker; do
            reference="$(cat "image-evidence/${service}.reference")"
            cosign verify "$reference" --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            for attempt in 1 2 3; do
              if docker pull "$reference"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
            printf 'CC_AUTH_%s_IMAGE=%s\n' "${service^^}" "$reference" >> "$GITHUB_ENV"
          done
      - name: Qualify packaged Phase 3 authorization
        run: npm exec nx run api-e2e:phase3-auth-integration
        env:
          CC_AUTH_PACKAGED_IMAGES: 'true'
          NX_NO_CLOUD: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: application-evidence
        if: always()
        with:
          name: qualification-phase3-auth-integration-${{ github.run_attempt }}
          path: dist/phase-3-evidence/
          if-no-files-found: warn
  bundle:
    needs:
      - publish
      - application
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          merge-multiple: true
          path: image-evidence
      - name: Require the successful application artifact
        env:
          EVIDENCE_ARTIFACT_ID: ${{ needs.application.outputs.evidence-artifact-id }}
        run: '[[ "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.application.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: qualification-evidence/qualification-phase3-auth-integration
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - run: npm ci
      - run: npm exec nx run deployment:build
        env:
          NX_NO_CLOUD: 'true'
      - name: Assemble and sign candidate bundle
        env:
          BUILD_MODE: lab
        run: |
          node deployment/release/candidate.mjs candidate-bundle image-evidence "$GITHUB_SHA" 3 qualification-evidence "$BUILD_MODE"
          source_time="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar --sort=name --mtime="@${source_time}" --owner=0 --group=0 --numeric-owner -cf phase-3-candidate.tar -C candidate-bundle .
          gzip -n phase-3-candidate.tar
          smoke_root="$(mktemp -d "$RUNNER_TEMP/cc-bundle-smoke-XXXXXX")"
          tar -xzf phase-3-candidate.tar.gz -C "$smoke_root"
          CC_BUNDLE_ROOT="$smoke_root" node --input-type=module -e 'import {pathToFileURL} from "node:url"; import {readFile} from "node:fs/promises"; const root=process.env.CC_BUNDLE_ROOT; await import(pathToFileURL(`${root}/deployment/installer/orchestrator.mjs`)); const {verifyReleaseFiles}=await import(pathToFileURL(`${root}/deployment/release/integrity.mjs`)); await verifyReleaseFiles(root,JSON.parse(await readFile(`${root}/release-manifest.json`)));'
          cosign sign-blob --yes --bundle phase-3-candidate.sigstore.json phase-3-candidate.tar.gz
          cosign verify-blob --bundle phase-3-candidate.sigstore.json --certificate-identity="${CC_SIGNING_IDENTITY}" --certificate-oidc-issuer=https://token.actions.githubusercontent.com phase-3-candidate.tar.gz
          cosign sign-blob --yes --bundle candidate-bundle/release-manifest.sigstore.json candidate-bundle/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-3-candidate-${{ github.sha }}
          path: |
            phase-3-candidate.tar.gz
            phase-3-candidate.sigstore.json
            candidate-bundle/release-manifest.json
            candidate-bundle/release-manifest.sigstore.json
          if-no-files-found: error
  extracted:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.7.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          merge-multiple: true
          path: image-evidence
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm exec nx run deployment:build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Prepare published image references
        run: |
          for service in api frontend worker; do
            reference="$(cat "image-evidence/${service}.reference")"
            cosign verify "$reference" --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            for attempt in 1 2 3; do
              if docker pull "$reference"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
            printf 'CC_AUTH_%s_IMAGE=%s\n' "${service^^}" "$reference" >> "$GITHUB_ENV"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-3-candidate-${{ github.sha }}
          path: published-bundle
      - name: Verify and extract the candidate bundle
        run: |
          identity="$CC_SIGNING_IDENTITY"
          cosign verify-blob --bundle published-bundle/phase-3-candidate.sigstore.json --certificate-identity="$identity" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-bundle/phase-3-candidate.tar.gz
          cosign verify-blob --bundle published-bundle/candidate-bundle/release-manifest.sigstore.json --certificate-identity="$identity" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-bundle/candidate-bundle/release-manifest.json
          mkdir extracted-candidate
          tar --extract --gzip --file published-bundle/phase-3-candidate.tar.gz --directory extracted-candidate --no-same-owner --no-same-permissions
          cmp published-bundle/candidate-bundle/release-manifest.json extracted-candidate/release-manifest.json
          node --input-type=module <<'NODE'
          import {loadQualificationBundle} from './deployment/release/qualification.mjs';
          await loadQualificationBundle('extracted-candidate', {
            phase: 3,
            sourceRevision: process.env.GITHUB_SHA,
            images: {
              frontend: process.env.CC_AUTH_FRONTEND_IMAGE,
              api: process.env.CC_AUTH_API_IMAGE,
              workers: process.env.CC_AUTH_WORKER_IMAGE,
            },
          });
          NODE
          printf 'CC_AUTH_INSTALLER_ROOT=%s/extracted-candidate\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Qualify fresh installation and application workflows
        run: npm exec nx run api-e2e:phase3-install-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Bind extracted Phase 3 evidence
        run: node deployment/release/phase3-bundle-qualification.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-3-extracted-qualification
          path: dist/phase-3-installation/
          if-no-files-found: warn
      - name: Publish tested lab release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lab_tag="phase-3-lab-${GITHUB_SHA:0:12}"
          cat > lab-notes.md <<'NOTES'
          This review build passed packaged application authorization, fresh All-Docker installation, and customer, invitation, access, and school workflows.
          Its archive, manifest, and application images retain signature verification and vulnerability scans.
          Google responses in the automated checks were simulated. Live Google privileges and human accessibility acceptance remain separate.
          Migration, backup, restore, and full profile qualification are outside this review build. Use candidate laboratory mode for installation.
          NOTES
          gh release create "$lab_tag" --target "$GITHUB_SHA" --prerelease --title "Campus Commander review ${GITHUB_SHA:0:12}" --notes-file lab-notes.md published-bundle/phase-3-candidate.tar.gz published-bundle/phase-3-candidate.sigstore.json published-bundle/candidate-bundle/release-manifest.json published-bundle/candidate-bundle/release-manifest.sigstore.json
