name: Phase 3 published profile qualification
on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      profile:
        type: string
        default: all-docker
      updateRelease:
        type: string
        default: ''
      upgrade:
        type: boolean
        default: false
      restore:
        type: boolean
        default: false
      faults:
        type: boolean
        default: false
      faultKind:
        type: string
        default: services
      lifecycle:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
env:
  CC_SIGNING_IDENTITY: https://github.com/CampusCommander/campus-commander/.github/workflows/phase-3-candidate.yml@refs/heads/codex/cc-57-phase3-delivery
jobs:
  installation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate qualification mode
        env:
          PROFILE: ${{ inputs.profile }}
          UPGRADE: ${{ inputs.upgrade }}
          RESTORE: ${{ inputs.restore }}
          FAULTS: ${{ inputs.faults }}
          FAULT_KIND: ${{ inputs.faultKind }}
          LIFECYCLE: ${{ inputs.lifecycle }}
          UPDATE_RELEASE: ${{ inputs.updateRelease }}
        run: |
          case "${PROFILE:-all-docker}" in
            all-docker) ;;
            hybrid)
              if [ "${LIFECYCLE:-false}" = true ] || [ -n "${UPDATE_RELEASE:-}" ] || { [ "$FAULTS" = true ] && [ "$FAULT_KIND" != services ] && [ "$FAULT_KIND" != certificates ] && [ "$FAULT_KIND" != capacity ]; }; then
                echo 'Hybrid qualification supports installation, Phase 2 upgrade, isolated restore, service faults, certificate faults, and capacity faults.' >&2
                exit 1
              fi
              ;;
            *) exit 1 ;;
          esac
          if [ "${RESTORE:-false}" = true ]; then
            if [ "$PROFILE" != hybrid ] || [ "$UPGRADE" = true ] || [ "$FAULTS" = true ] || [ "${LIFECYCLE:-false}" = true ] || [ -n "${UPDATE_RELEASE:-}" ]; then
              exit 1
            fi
          fi
          [ "$UPGRADE" != true ] || [ "$FAULTS" != true ]
          if [ "${LIFECYCLE:-false}" = true ]; then
            if [ "$UPGRADE" = true ] || [ "$FAULTS" = true ]; then
              exit 1
            fi
          fi
          if [ -n "${UPDATE_RELEASE:-}" ]; then
            if [ "$UPGRADE" = true ] || [ "$FAULTS" = true ] || [ "${LIFECYCLE:-false}" = true ]; then
              exit 1
            fi
          fi
          [ "$FAULT_KIND" = services ] || [ "$FAULT_KIND" = provider ] || [ "$FAULT_KIND" = certificates ] || [ "$FAULT_KIND" = capacity ]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.7.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Select shared browser storage
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/.cache/ms-playwright\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm exec nx run deployment:build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Download and verify the published laboratory bundle
        env:
          RELEASE_TAG: ${{ inputs.release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          [[ "$RELEASE_TAG" =~ ^phase-3-lab-[a-f0-9]{12}$ ]] || { echo 'Select an immutable Phase 3 laboratory release.' >&2; exit 1; }
          mkdir published-bundle image-evidence extracted-candidate
          gh release download "$RELEASE_TAG" --dir published-bundle --pattern 'phase-3-candidate*' --pattern 'release-manifest*'
          cosign verify-blob --bundle published-bundle/phase-3-candidate.sigstore.json --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-bundle/phase-3-candidate.tar.gz
          cosign verify-blob --bundle published-bundle/release-manifest.sigstore.json --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-bundle/release-manifest.json
          tar --extract --gzip --file published-bundle/phase-3-candidate.tar.gz --directory extracted-candidate --no-same-owner --no-same-permissions
          cmp published-bundle/release-manifest.json extracted-candidate/release-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {loadQualificationBundle} from './deployment/release/qualification.mjs';
          const manifest=JSON.parse(await readFile('published-bundle/release-manifest.json'));
          assert.equal(manifest.phase,3);
          assert.equal(manifest.validationScope,'lab');
          assert.equal(manifest.qualification,'candidate-only');
          assert.match(manifest.sourceRevision,/^[a-f0-9]{40}$/);
          assert.equal(process.env.RELEASE_TAG,'phase-3-lab-'+manifest.sourceRevision.slice(0,12));
          await loadQualificationBundle('extracted-candidate',manifest);
          for(const [service,key] of [['api','api'],['frontend','frontend'],['worker','workers']]){
            const reference=manifest.images[key];
            assert.match(reference,new RegExp('^ghcr\\.io/campuscommander/campus-commander-'+service+'@sha256:[a-f0-9]{64}$'));
            await writeFile('image-evidence/'+service+'.reference',reference+'\n');
          }
          await appendFile(process.env.GITHUB_ENV,'CC_AUTH_INSTALLER_ROOT='+process.cwd()+'/extracted-candidate\n');
          NODE
      - name: Prepare published image references
        run: |
          for service in api frontend worker; do
            reference="$(cat "image-evidence/${service}.reference")"
            cosign verify "$reference" --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            for attempt in 1 2 3; do
              if docker pull "$reference"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
            printf 'CC_AUTH_%s_IMAGE=%s\n' "${service^^}" "$reference" >> "$GITHUB_ENV"
          done
      - name: Download and verify the guided update bundle
        if: inputs.updateRelease != ''
        env:
          RELEASE_TAG: ${{ inputs.updateRelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          [[ "$RELEASE_TAG" =~ ^phase-3-lab-[a-f0-9]{12}$ ]] || { echo 'Select an immutable Phase 3 laboratory release.' >&2; exit 1; }
          mkdir published-update update-image-evidence extracted-update
          gh release download "$RELEASE_TAG" --dir published-update --pattern 'phase-3-candidate*' --pattern 'release-manifest*'
          cosign verify-blob --bundle published-update/phase-3-candidate.sigstore.json --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-update/phase-3-candidate.tar.gz
          cosign verify-blob --bundle published-update/release-manifest.sigstore.json --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-update/release-manifest.json
          tar --extract --gzip --file published-update/phase-3-candidate.tar.gz --directory extracted-update --no-same-owner --no-same-permissions
          cmp published-update/release-manifest.json extracted-update/release-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {loadQualificationBundle} from './deployment/release/qualification.mjs';
          const manifest=JSON.parse(await readFile('published-update/release-manifest.json'));
          assert.equal(manifest.phase,3);
          assert.equal(manifest.validationScope,'lab');
          assert.equal(manifest.qualification,'candidate-only');
          assert.match(manifest.sourceRevision,/^[a-f0-9]{40}$/);
          assert.equal(process.env.RELEASE_TAG,'phase-3-lab-'+manifest.sourceRevision.slice(0,12));
          await loadQualificationBundle('extracted-update',manifest);
          assert.notEqual(manifest.sourceRevision,JSON.parse(await readFile('published-bundle/release-manifest.json')).sourceRevision);
          for(const [service,key] of [['api','api'],['frontend','frontend'],['worker','workers']]){
            const reference=manifest.images[key];
            assert.match(reference,new RegExp('^ghcr\\.io/campuscommander/campus-commander-'+service+'@sha256:[a-f0-9]{64}$'));
            await writeFile('update-image-evidence/'+service+'.reference',reference+'\n');
          }
          await appendFile(process.env.GITHUB_ENV,'CC_AUTH_UPDATE_INSTALLER_ROOT='+process.cwd()+'/extracted-update\n');
          NODE
      - name: Prepare guided update image references
        if: inputs.updateRelease != ''
        run: |
          for service in api frontend worker; do
            reference="$(cat "update-image-evidence/${service}.reference")"
            cosign verify "$reference" --certificate-identity="$CC_SIGNING_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            for attempt in 1 2 3; do
              if docker pull "$reference"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
          done
      - name: Verify the pinned Phase 2 upgrade bundle
        if: inputs.upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_IDENTITY: https://github.com/CampusCommander/campus-commander/.github/workflows/phase-2-candidate.yml@refs/heads/implementation/phase-2-cc-22
        run: |-
          mkdir published-baseline extracted-baseline
          tag="$(node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync('deployment/qualification/phase-2-upgrade-baseline.json'));if(!/^phase-2-lab-[a-f0-9]{12}$/.test(b.sourceTag))throw Error('Invalid baseline tag');console.log(b.sourceTag)")"
          gh release download "$tag" --dir published-baseline --pattern 'phase-2-candidate*' --pattern 'release-manifest*'
          cosign verify-blob --bundle published-baseline/phase-2-candidate.sigstore.json --certificate-identity="$BASELINE_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-baseline/phase-2-candidate.tar.gz
          cosign verify-blob --bundle published-baseline/release-manifest.sigstore.json --certificate-identity="$BASELINE_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com published-baseline/release-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const pinned=JSON.parse(await readFile('deployment/qualification/phase-2-upgrade-baseline.json'));
          for(const [name,expected] of [['phase-2-candidate.tar.gz',pinned.sourceArchiveSha256],['release-manifest.json',pinned.sourceManifestSha256]])
            assert.equal(createHash('sha256').update(await readFile('published-baseline/'+name)).digest('hex'),expected);
          NODE
          tar --extract --gzip --file published-baseline/phase-2-candidate.tar.gz --directory extracted-baseline --no-same-owner --no-same-permissions
          cmp published-baseline/release-manifest.json extracted-baseline/release-manifest.json
          node --input-type=module <<'NODE'
          import {appendFile,writeFile} from 'node:fs/promises';
          import {loadPhase2UpgradeBaseline} from './api-e2e/phase3-upgrade-fixture.mjs';
          const baseline=await loadPhase2UpgradeBaseline('extracted-baseline');
          await writeFile('published-baseline/images.txt',Object.values(baseline.manifest.images).join('\n')+'\n');
          await appendFile(process.env.GITHUB_ENV,'CC_AUTH_BASELINE_INSTALLER_ROOT='+process.cwd()+'/extracted-baseline\n');
          NODE
          while IFS= read -r reference; do
            cosign verify "$reference" --certificate-identity="$BASELINE_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            docker pull "$reference"
          done < published-baseline/images.txt
      - name: Prepare the shared-storage fixture account
        if: inputs.profile == 'hybrid'
        run: |
          if ! getent passwd 1000 > /dev/null; then
            sudo useradd --uid 1000 --user-group --create-home cc-qualification
          fi
          if ! command -v setfacl > /dev/null; then
            sudo apt-get install --no-install-recommends -y acl
          fi
          cp -a "${DOCKER_CONFIG:-$HOME/.docker}" "$GITHUB_WORKSPACE/.qualification-docker"
          fixture_socket="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          test "${fixture_socket#unix://}" != "$fixture_socket"
          fixture_socket="${fixture_socket#unix://}"
          sudo setfacl -m u:1000:rw "$fixture_socket"
          fixture_directory="$(dirname "$fixture_socket")"
          while test "$fixture_directory" != /; do
            sudo setfacl -m u:1000:x "$fixture_directory"
            fixture_directory="$(dirname "$fixture_directory")"
          done
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          printf 'DOCKER_CONFIG=%s/.qualification-docker\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Qualify installed Phase 3 workflows
        if: inputs.profile == 'all-docker' && inputs.upgrade != true && inputs.faults != true && inputs.lifecycle != true && inputs.updateRelease == ''
        run: npm exec nx run api-e2e:phase3-install-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify installed Phase 3 hybrid workflows
        if: inputs.profile == 'hybrid' && inputs.upgrade != true && inputs.restore != true && inputs.faults != true
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-install-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify Phase 3 hybrid service interruptions
        if: inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'services'
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-fault-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify Phase 3 hybrid certificate failures
        if: inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'certificates'
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-certificate-fault-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify Phase 3 hybrid capacity failure
        if: inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'capacity'
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-capacity-fault-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify isolated Phase 3 hybrid restore
        if: inputs.profile == 'hybrid' && inputs.restore
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-restore-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify Phase 2-to-3 hybrid upgrade
        if: inputs.profile == 'hybrid' && inputs.upgrade
        run: sudo -H -u '#1000' -g '#1000' --preserve-env=CC_AUTH_INSTALLER_ROOT,CC_AUTH_BASELINE_INSTALLER_ROOT,CC_AUTH_API_IMAGE,CC_AUTH_FRONTEND_IMAGE,CC_AUTH_WORKER_IMAGE,NX_NO_CLOUD,NX_DAEMON,PLAYWRIGHT_BROWSERS_PATH,DOCKER_CONFIG /usr/bin/env "PATH=$PATH" npm exec nx run api-e2e:phase3-hybrid-upgrade-integration
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - name: Qualify Phase 2-to-3 upgrade and workflows
        if: inputs.profile == 'all-docker' && inputs.upgrade
        run: npm exec nx run api-e2e:phase3-upgrade-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 service interruptions
        if: inputs.profile == 'all-docker' && inputs.faults && inputs.faultKind == 'services'
        run: npm exec nx run api-e2e:phase3-fault-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 provider failures
        if: inputs.profile == 'all-docker' && inputs.faults && inputs.faultKind == 'provider'
        run: npm exec nx run api-e2e:phase3-provider-fault-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 certificate failures
        if: inputs.profile == 'all-docker' && inputs.faults && inputs.faultKind == 'certificates'
        run: npm exec nx run api-e2e:phase3-certificate-fault-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 capacity failure
        if: inputs.profile == 'all-docker' && inputs.faults && inputs.faultKind == 'capacity'
        run: npm exec nx run api-e2e:phase3-capacity-fault-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 guided update
        if: inputs.updateRelease != ''
        run: npm exec nx run api-e2e:phase3-update-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Qualify Phase 3 installer lifecycle
        if: inputs.lifecycle
        run: npm exec nx run api-e2e:phase3-lifecycle-integration
        env:
          NX_NO_CLOUD: 'true'
      - name: Restore evidence ownership
        if: always() && inputs.profile == 'hybrid'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.profile == 'hybrid' && inputs.restore && 'phase-3-hybrid-restore' || inputs.profile == 'hybrid' && inputs.upgrade && 'phase-3-hybrid-upgrade' || inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'capacity' && 'phase-3-hybrid-capacity-faults' || inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'certificates' && 'phase-3-hybrid-certificate-faults' || inputs.profile == 'hybrid' && inputs.faults && 'phase-3-hybrid-service-faults' || inputs.profile == 'hybrid' && 'phase-3-hybrid-installation' || inputs.updateRelease != '' && 'phase-3-guided-update' || inputs.lifecycle && 'phase-3-installer-lifecycle' || inputs.faults && inputs.faultKind == 'capacity' && 'phase-3-capacity-faults' || inputs.faults && inputs.faultKind == 'certificates' && 'phase-3-certificate-faults' || inputs.faults && inputs.faultKind == 'provider' && 'phase-3-provider-faults' || inputs.faults && 'phase-3-service-faults' || inputs.upgrade && 'phase-3-upgrade-workflows' || 'phase-3-installed-workflows' }}
          path: ${{ inputs.profile == 'hybrid' && inputs.restore && 'dist/phase-3-hybrid-restore/' || inputs.profile == 'hybrid' && inputs.upgrade && 'dist/phase-3-hybrid-upgrade/' || inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'capacity' && 'dist/phase-3-hybrid-capacity-faults/' || inputs.profile == 'hybrid' && inputs.faults && inputs.faultKind == 'certificates' && 'dist/phase-3-hybrid-certificate-faults/' || inputs.profile == 'hybrid' && inputs.faults && 'dist/phase-3-hybrid-faults/' || inputs.profile == 'hybrid' && 'dist/phase-3-hybrid-installation/' || inputs.updateRelease != '' && 'dist/phase-3-update/' || inputs.lifecycle && 'dist/phase-3-lifecycle/' || inputs.faults && inputs.faultKind == 'capacity' && 'dist/phase-3-capacity-faults/' || inputs.faults && inputs.faultKind == 'certificates' && 'dist/phase-3-certificate-faults/' || inputs.faults && inputs.faultKind == 'provider' && 'dist/phase-3-provider-faults/' || inputs.faults && 'dist/phase-3-faults/' || inputs.upgrade && 'dist/phase-3-upgrade/' || 'dist/phase-3-installation/' }}
          if-no-files-found: warn
