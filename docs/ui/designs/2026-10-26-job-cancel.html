  /* frontend/src/theme/tokens.css (light values) */
  :root {
    color-scheme: light dark;
    --cc-space-xs: 4px; --cc-space-sm: 8px; --cc-space-md: 12px; --cc-space-lg: 16px;
    --cc-space-xl: 24px; --cc-space-xxl: 32px; --cc-radius-control: 4px; --cc-radius-chip: 999px;
    --cc-header-height: 64px; --cc-footer-height: 40px; --cc-row-height-grid: 32px; --cc-card-padding: 16px;
    --cc-page-padding: 24px; --cc-content-max-width: 720px;
    --cc-surface-app: #f8fafc; --cc-surface-card: #ffffff; --cc-surface-hover: #f1f5f9;
    --cc-border: #e2e8f0; --cc-accent: #1a73e8; --cc-text-primary: #202124; --cc-text-secondary: #5f6368;
    --cc-surface-selected: rgb(26 115 232 / 8%); --cc-status-success: #188038; --cc-status-warning: #f9ab00;
    --cc-status-error: #d93025; --cc-text-disabled: #9aa0a6; --cc-text-on-accent: #ffffff;
    --cc-surface-scrim: rgb(0 0 0 / 32%); --cc-status-info: #1a73e8; --cc-status-success-text: #188038;
    --cc-status-warning-text: #7a4e00; --cc-status-error-text: #b3261e; --cc-text-link: #1556b0;
    --cc-border-control: #80868b;
    /* Mockup annotation colors, reused from the approved mockups. */
    --mock-border: #c9a227; --mock-fill: #fffdf5; --mock-text: #7a4e00;
  }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (text) => String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- Angular Material markup (button.mjs template and host classes of Material 22) ----------
  // disabledInteractive keeps a disabled button focusable: aria-disabled replaces the disabled attribute.
  function button(label, { kind = 'filled', disabled = false, interactive = false, attrs = '', tag = 'button' } = {}) {
    const look = { filled: 'mdc-button--unelevated mat-mdc-unelevated-button', text: 'mat-mdc-button', outlined: 'mdc-button--outlined mat-mdc-outlined-button' }[kind];
    const state = disabled ? ` mat-mdc-button-disabled${interactive ? ' mat-mdc-button-disabled-interactive' : ''}` : '';
    const classes = `mdc-button mat-mdc-button-base ${look}${state}`;
    const inner = `<span class="mat-mdc-button-persistent-ripple mdc-button__ripple"></span><span class="mdc-button__label">${esc(label)}</span><span class="mat-focus-indicator"></span><span class="mat-mdc-button-touch-target"></span>`;
    if (tag === 'a') return `<a class="${classes}" ${attrs}>${inner}</a>`;
    const off = disabled ? (interactive ? ' aria-disabled="true"' : ' disabled') : '';
    return `<button class="${classes}" type="button"${off} ${attrs}>${inner}</button>`;
  }
  const deviceCountText = (n) => `${n.toLocaleString('en-US')} ${n === 1 ? 'device' : 'devices'}`;

  // ---------- Scenario (notes.md, Scenario) ----------
  // Review administrator, Monday Oct 26. UPD-001 sets Annotated location to North lab on 48 devices
  // (requested 10:40 AM). STS-001 disables 18 devices (requested 10:41 AM) and waits for dispatch,
  // because UPD-001 holds the write slot. Clock order: 05, 06 (10:41 AM), 01, 02, 03 (10:42 AM), 04 (10:43 AM), 07 (10:44 AM).
  const PERSON = 'Review administrator';
  const STATUS = { running: ['Running', 'info'], queued: ['Queued', 'neutral'], cancelled: ['Cancelled', 'neutral'] };
  const OUTCOME = { pending: ['Pending', 'neutral'], succeeded: ['Succeeded', 'success'], failed: ['Failed', 'error'],
    unknown: ['Unknown', 'warning'], cancelled: ['Cancelled', 'neutral'] };
  const NOT_SENT = 'Not sent to Google';

  // UPD-001, operations 37 to 42 (page 7 of 8), where the work stops. One field per device.
  const UPD_TARGETS = [['02QJANY', 'North lab mvjusgh0'], ['02A1MB6', 'North lab mvjusgh0'], ['04XTBHJ', 'Front Office'],
    ['0727D2E', null], ['04A9BVS', null], ['08V5B5S', null]];
  const updRows = (outcomes) => UPD_TARGETS.map(([serial, before], i) => ({
    serial, operation: 'Annotated location', before: before ?? 'Not set', requested: 'North lab', ...outcomes[i] }));
  const P = (time) => ({ outcome: 'pending', time });
  const S = (time) => ({ outcome: 'succeeded', time });
  const UPD_PAGE = { start: 37, total: 48, previous: true, next: true };
  // STS-001, operations 1 to 6 of 18.
  const STS_TARGETS = ['01P0T1V', '02A1MB6', '02QJANY', '04A9BVS', '04XTBHJ', '08V5B5S'];
  const stsRows = (outcome) => STS_TARGETS.map((serial) => ({ serial, operation: 'Disable', before: 'Active', requested: 'Disabled', ...outcome }));
  const STS_PAGE = { start: 1, total: 18, previous: false, next: true };
  const counts = (c) => ({ succeeded: 0, failed: 0, unknown: 0, expired: 0, pending: 0, skipped: 0, cancelled: 0, ...c });

  const JOBS = {
    running: {
      title: 'Update device annotations', id: 'UPD-001', status: 'running', devices: 48, cancel: 'offer',
      identity: `Requested by ${PERSON} · Oct 26, 10:40 AM · Duration: 2m 08s`,
      counts: counts({ succeeded: 36, pending: 12 }),
      rows: updRows([P('10:40 AM'), P('10:40 AM'), P('10:40 AM'), P('10:40 AM'), P('10:40 AM'), P('10:40 AM')]), page: UPD_PAGE,
      activity: '10:42 AM · 36 updates confirmed. Twelve operations remain pending.',
    },
    requested: {
      title: 'Update device annotations', id: 'UPD-001', status: 'running', devices: 48, cancel: 'requested',
      identity: `Requested by ${PERSON} · Oct 26, 10:40 AM · Duration: 2m 27s`,
      cancelLine: `Cancellation requested by ${PERSON} · Oct 26, 10:42 AM`,
      banner: { title: 'Cancellation requested', line: 'The job stops within 30 seconds',
        text: 'Requests already sent to Google finish and keep their results. Pending operations that have not reached Google end Cancelled. Nothing rolls back.' },
      counts: counts({ succeeded: 38, pending: 10 }),
      rows: updRows([S('10:42 AM'), S('10:42 AM'), P('10:40 AM'), P('10:40 AM'), P('10:40 AM'), P('10:40 AM')]), page: UPD_PAGE,
      activity: '10:42 AM · 38 updates confirmed. Ten operations remain pending.',
    },
    cancelled: {
      title: 'Update device annotations', id: 'UPD-001', status: 'cancelled', devices: 48, cancel: null,
      identity: `Requested by ${PERSON} · Oct 26, 10:40 AM · Duration: 2m 58s`,
      cancelLine: `Cancellation requested by ${PERSON} · Oct 26, 10:42 AM`,
      counts: counts({ succeeded: 38, failed: 1, unknown: 1, cancelled: 8 }),
      rows: updRows([S('10:42 AM'), S('10:42 AM'),
        { outcome: 'failed', time: '10:42 AM', reason: 'Google quota stopped the update for 04XTBHJ.' },
        { outcome: 'unknown', time: '10:43 AM' },
        { outcome: 'cancelled', time: '10:43 AM', note: NOT_SENT }, { outcome: 'cancelled', time: '10:43 AM', note: NOT_SENT }]),
      page: UPD_PAGE,
      activity: '10:43 AM · Cancellation stopped 8 operations before they reached Google. Google quota stopped the update for 04XTBHJ. 0727D2E requires reconciliation before any retry.',
    },
    queued: {
      title: 'Disable devices', id: 'STS-001', status: 'queued', devices: 18, cancel: 'offer',
      identity: `Requested by ${PERSON} · Oct 26, 10:41 AM · Duration: not started`,
      counts: counts({ pending: 18 }),
      rows: stsRows({ outcome: 'pending', time: '10:41 AM' }), page: STS_PAGE,
      activity: '10:41 AM · 0 status changes confirmed. Eighteen operations remain pending.',
    },
    queuedCancelled: {
      title: 'Disable devices', id: 'STS-001', status: 'cancelled', devices: 18, cancel: null,
      identity: `Requested by ${PERSON} · Oct 26, 10:41 AM · Duration: not started`,
      cancelLine: `Cancellation requested by ${PERSON} · Oct 26, 10:41 AM`,
      counts: counts({ cancelled: 18 }),
      rows: stsRows({ outcome: 'cancelled', time: '10:41 AM', note: NOT_SENT }), page: STS_PAGE,
      activity: '10:41 AM · Cancellation ended the job before it started. No request reached Google.',
    },
  };

  // ---------- Job page (job-detail.html) ----------
  // A literal that the app holds with another meaning carries data-new-use (check-strings.py).
  function chip(label, tone, { small = false, newUse = false } = {}) {
    return `<span class="status-chip${small ? ' small' : ''} tone-${tone}"${newUse ? ' data-new-use' : ''}><span class="dot" aria-hidden="true"></span>${esc(label)}</span>`;
  }
  function jobPage(job) {
    const c = job.counts;
    const counters = [['Succeeded', c.succeeded, 'success'], ['Failed', c.failed, 'error'], ['Unknown', c.unknown, 'warning'],
      ['Expired', c.expired, 'warning'], ['Pending', c.pending, 'neutral'], ['Skipped', c.skipped, 'neutral'], ['Cancelled', c.cancelled, 'neutral']];
    const attention = c.failed + c.unknown + c.expired;
    const [statusLabel, statusTone] = STATUS[job.status];
    const cancelControl = job.cancel === 'offer'
      ? button('Cancel pending work', { kind: 'outlined', attrs: 'data-cancel-open' })
      : job.cancel === 'requested'
        ? button('Cancellation requested', { kind: 'outlined', disabled: true, interactive: true, attrs: 'data-cancel-requested' })
        : '';
    const banner = job.banner
      ? `<section class="banner" aria-labelledby="job-cancel-title" role="status">
          <h2 id="job-cancel-title" data-join><strong>${esc(job.banner.title)}</strong> · ${esc(job.banner.line)}</h2>
          <p>${esc(job.banner.text)}</p>
        </section>`
      : '';
    const rows = job.rows.map((row) => {
      const [label, tone] = OUTCOME[row.outcome];
      const action = row.outcome === 'failed' ? button('Inspect failure', { kind: 'text' })
        : row.outcome === 'unknown' ? button('Reconcile', { kind: 'text' }) : '';
      return `<tr>
        <td><div class="device-cell"><a class="details" href="#" data-noop aria-label="Open device ${row.serial}"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></a><span>${row.serial}</span></div></td>
        <td>${esc(row.operation)}</td><td><span>${esc(row.before)}</span></td><td><span>${esc(row.requested)}</span></td>
        <td class="outcome-cell">${chip(label, tone, { small: true, newUse: row.outcome === 'cancelled' })}${row.reason ? `<span class="outcome-reason">${esc(row.reason)}</span>` : ''}${row.note ? `<span class="outcome-note">${esc(row.note)}</span>` : ''}</td>
        <td><time>${row.time}</time></td>
        <td class="row-actions">${action}</td>
      </tr>`;
    }).join('');
    const end = job.page.start + job.rows.length - 1;
    return `<div class="job-detail">
      <header class="page-header"><h1>${esc(job.title)}</h1><p class="subtitle">Job ${job.id} · ${statusLabel}</p></header>
      <div class="toolbar">${button('Back to jobs', { kind: 'outlined', tag: 'a', attrs: 'href="#07-jobs-grid-cancelled" data-go="07-jobs-grid-cancelled"' })}
        <div class="toolbar-actions">${button('Refresh', { kind: 'outlined', attrs: 'data-refresh' })}${cancelControl}</div></div>
      ${banner}
      <section class="identity card" aria-labelledby="job-identity-title">
        <div class="identity-head"><h2 id="job-identity-title">${job.id} · ${deviceCountText(job.devices)}</h2>
          ${chip(statusLabel, statusTone, { newUse: job.status === 'cancelled' })}</div>
        <p class="identity-meta">${esc(job.identity)}</p>
        ${job.cancelLine ? `<p class="identity-meta">${esc(job.cancelLine)}</p>` : ''}
      </section>
      <section class="counters-section" aria-labelledby="job-counts-title">
        <h2 id="job-counts-title" class="visually-hidden">Operation counts</h2>
        <dl class="counters">${counters.map(([label, value, tone]) => `<div class="counter"><dt>${label}</dt><dd class="value tone-${tone}">${value.toLocaleString('en-US')}</dd></div>`).join('')}</dl>
      </section>
      <section class="operations" aria-labelledby="operations-title">
        <div class="operations-head"><h2 id="operations-title">Operation results</h2>
          <div class="operations-actions">${attention > 0 ? button(`Show ${attention} needing attention`, { kind: 'outlined' }) : ''}</div></div>
        <div class="grid-region">
          <div class="table-scroll" tabindex="0" role="region" aria-label="Operation results table">
            <table class="operations-table">
              <caption class="visually-hidden">Operation results for job ${job.id}</caption>
              <thead><tr><th scope="col">Device</th><th scope="col">Operation</th><th scope="col">Before</th><th scope="col">Requested</th><th scope="col">Outcome</th><th scope="col">Updated</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <footer class="grid-footer"><span class="footer-count" role="status">Rows ${job.page.start}–${end} of ${job.page.total} operations</span>
            <div class="footer-paging">
              <button type="button" class="page-button" aria-label="Previous operations page"${job.page.previous ? '' : ' disabled'}><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
              <button type="button" class="page-button" aria-label="Next operations page"${job.page.next ? '' : ' disabled'}><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
            </div></footer>
        </div>
      </section>
      <section class="activity card" aria-labelledby="activity-title"><h2 id="activity-title">Latest activity</h2><p>${esc(job.activity)}</p></section>
    </div>`;
  }

  // ---------- The cancel question (device-grid-revert-dialog.html) ----------
  const QUESTIONS = {
    running: {
      title: 'Cancel pending work on UPD-001?', keep: 'Keep job running', next: '03-cancellation-requested',
      lines: ['12 of 48 operations are pending. Those that have not reached Google end Cancelled and never run.',
        'Requests already sent to Google finish and keep their results. The 36 confirmed updates stay. Nothing rolls back.'],
    },
    queued: {
      title: 'Cancel pending work on STS-001?', keep: 'Keep job waiting', next: '06-queued-cancelled',
      lines: ['No operation has started. All 18 operations end Cancelled.',
        'No request reaches Google. The 18 devices keep their current status.'],
    },
  };
  function questionDialog(q) {
    return `<h2 id="dialog-title">${esc(q.title)}</h2>
      <div class="picker-content">${q.lines.map((line, i) => `<p id="dialog-question-${i + 1}">${esc(line)}</p>`).join('')}</div>
      <div class="picker-actions">${button(q.keep, { kind: 'text', attrs: 'data-keep' })}${button('Cancel pending work', { attrs: 'data-cancel-confirm' })}</div>`;
  }

  // ---------- Jobs grid (jobs.html): the two cancelled jobs above the real rows ----------
  const GRID_ROWS = [
    { id: 'STS-001', action: 'Disable devices', progress: ['0 succeeded', '18 cancelled'], scope: '18 devices',
      created: ['Oct 26, 10:41 AM', 'Not started'], go: '06-queued-cancelled' },
    { id: 'UPD-001', action: 'Update device annotations', progress: ['38 succeeded', '1 failed · 1 unknown · 8 cancelled'], scope: '48 devices',
      created: ['Oct 26, 10:40 AM', '2m 58s'], go: '04-cancelled-result' },
  ];
  function gridRows(rows) {
    return `<table class="jobs-table"><colgroup><col style="width:18%"><col style="width:19%"><col style="width:19%"><col style="width:12%"><col style="width:14%"><col style="width:18%"></colgroup>
      <tbody>${rows.map((row) => `<tr>
        <td><div class="job-cell"><a class="details" href="#${row.go}" data-go="${row.go}" aria-label="Open details for job ${row.id}"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></a>
          <div class="job-text"><span class="job-id">${row.id}</span><span class="line">${esc(row.action)}</span></div></div></td>
        <td>${row.chip || chip('Cancelled', 'neutral', { newUse: true })}</td>
        <td class="progress"><span>${esc(row.progress[0])}</span><span class="line">${esc(row.progress[1])}</span></td>
        <td>${esc(row.scope)}</td><td>${esc(row.requestedBy || PERSON)}</td>
        <td><span>${esc(row.created[0])}</span><span class="line">${esc(row.created[1])}</span></td>
      </tr>`).join('')}</tbody></table>`;
  }
  function gridFoot(count, rows) {
    return `<footer class="grid-footer"><span class="footer-count" role="status">${esc(count)}</span>
      <div class="footer-paging"><span class="footer-rows">${esc(rows)}</span>
        <button type="button" class="page-button" aria-label="Previous page" disabled><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
        <button type="button" class="page-button" aria-label="Next page" disabled><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
      </div></footer>`;
  }

  // ---------- States ----------
  const STATES = {
    '01-running-job': () => ({ bg: 'jobs', bell: 'running', job: 'running' }),
    '02-cancel-confirm-running': () => ({ bg: 'jobs', bell: 'running', job: 'running', dialog: 'running' }),
    '03-cancellation-requested': () => ({ bg: 'jobs', bell: 'running', job: 'requested' }),
    '04-cancelled-result': () => ({ bg: 'jobs', bell: 'attention', job: 'cancelled' }),
    '05-queued-confirm': () => ({ bg: 'jobs', bell: 'running', job: 'queued', dialog: 'queued' }),
    '06-queued-cancelled': () => ({ bg: 'jobs', bell: 'running', job: 'queuedCancelled' }),
    '07-jobs-grid-cancelled': () => ({ bg: 'grid', grid: { rows: GRID_ROWS, count: '8 jobs · Updated Oct 26, 10:44 AM', range: 'Rows 1–8 of 8' } }),
  };

  const frame = $('frame');
  let current = '01-running-job';
  let live = null;

  function render(s) {
    frame.dataset.bg = s.bg;
    frame.style.height = '';
    const bell = $('bell');
    bell.hidden = !s.bell;
    if (s.bell) bell.dataset.bell = s.bell;
    $('job').hidden = !s.job;
    if (s.job) {
      $('job').innerHTML = jobPage(typeof s.job === 'string' ? JOBS[s.job] : s.job);
      // The page grows to the job content, the 24 px page gap, and the footer. A dialog state is a
      // viewport capture, so its PNG shows the top 900 px with the dialog fixed to the viewport.
      const bottom = $('job').offsetTop + $('job').offsetHeight;
      frame.style.height = `${Math.max(900, Math.min(1600, bottom + 24 + 40))}px`;
    }
    $('grid').hidden = !s.grid;
    $('grid-foot').hidden = !s.grid;
    if (s.grid) {
      $('grid').innerHTML = gridRows(s.grid.rows);
      $('grid-foot').innerHTML = gridFoot(s.grid.count, s.grid.range);
      frame.style.height = '994px';
    }
    $('dialog').hidden = !s.dialog;
    if (s.dialog) $('dialog-box').innerHTML = questionDialog(QUESTIONS[s.dialog]);
  }

  function show(state) {
    if (!STATES[state]) state = '01-running-job';
    current = state;
    live = STATES[state]();
    render(live);
    document.querySelectorAll('.mock-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.go === state)));
    history.replaceState(null, '', '#' + state);
  }

  // A live change of the shown state: the question opens or closes.
  function update(change) {
    live = { ...live, ...change };
    render(live);
    const named = JSON.stringify(STATES[current]()) === JSON.stringify(live);
    document.querySelectorAll('.mock-seg button').forEach((b) => b.setAttribute('aria-pressed', String(named && b.dataset.go === current)));
  }

  document.addEventListener('click', (event) => {
    const target = event.target;
    if (target.closest('[data-cancel-open]')) { update({ dialog: live.job === 'queued' ? 'queued' : 'running' }); return; }
    if (target.closest('[data-keep]')) { update({ dialog: null }); return; }
    if (target.closest('[data-cancel-confirm]')) { show(QUESTIONS[live.dialog].next); return; }
    if (target.closest('[data-cancel-requested]')) return;
    if (target.closest('[data-noop]')) { event.preventDefault(); return; }
    // The mockup has no live job stream: Refresh in state 03 reads the settled job of state 04.
    if (target.closest('[data-refresh]')) { if (current === '03-cancellation-requested') show('04-cancelled-result'); return; }
    const go = target.closest('[data-go]');
    if (go && !go.disabled) { event.preventDefault(); show(go.dataset.go); }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && live.dialog) update({ dialog: null });
  });

  // Deep links: a changed hash shows its state (#01-running-job ... #07-jobs-grid-cancelled).
  window.addEventListener('hashchange', () => { const state = location.hash.slice(1); if (STATES[state] && state !== current) show(state); });
  show(location.hash.slice(1) || '01-running-job');
  window.mockup = { show, render, update, STATES: Object.keys(STATES), STATE_FNS: STATES, JOBS, QUESTIONS, GRID_ROWS, STATUS, OUTCOME,
    button, chip, jobPage, gridRows, gridFoot, questionDialog };
})();
</script>
</body>
</html>
