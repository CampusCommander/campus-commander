  /* Angular Material 22 component CSS (work/material/extract.py). */
/* Angular Material 22.2.2, button.mjs */
.mat-mdc-button-base {
  text-decoration: none;
}
.mat-mdc-button-base .mat-icon {
  min-height: fit-content;
  flex-shrink: 0;
}
@media (hover: none) {
  .mat-mdc-button-base:hover > span.mat-mdc-button-persistent-ripple::before {
    opacity: 0;
  }
}

.mdc-button {
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-width: 64px;
  border: none;
  outline: none;
  line-height: inherit;
  -webkit-appearance: none;
  overflow: visible;
  vertical-align: middle;
  background: transparent;
  padding: 0 8px;
}
.mdc-button::-moz-focus-inner {
  padding: 0;
  border: 0;
}
.mdc-button:active {
  outline: none;
}
.mdc-button:hover {
  cursor: pointer;
}
.mdc-button:disabled {
  cursor: default;
  pointer-events: none;
}
.mdc-button[hidden] {
  display: none;
}
.mdc-button .mdc-button__label {
  position: relative;
}

.mat-mdc-button {
  padding: 0 var(--mat-button-text-horizontal-padding, 12px);
  height: var(--mat-button-text-container-height, 40px);
  font-family: var(--mat-button-text-label-text-font, var(--mat-sys-label-large-font));
  font-size: var(--mat-button-text-label-text-size, var(--mat-sys-label-large-size));
  letter-spacing: var(--mat-button-text-label-text-tracking, var(--mat-sys-label-large-tracking));
  text-transform: var(--mat-button-text-label-text-transform);
  font-weight: var(--mat-button-text-label-text-weight, var(--mat-sys-label-large-weight));
}
.mat-mdc-button, .mat-mdc-button .mdc-button__ripple {
  border-radius: var(--mat-button-text-container-shape, var(--mat-sys-corner-full));
}
.mat-mdc-button:not(:disabled) {
  color: var(--mat-button-text-label-text-color, var(--mat-sys-primary));
}
.mat-mdc-button[disabled], .mat-mdc-button.mat-mdc-button-disabled {
  cursor: default;
  pointer-events: none;
  color: var(--mat-button-text-disabled-label-text-color, color-mix(in srgb, var(--mat-sys-on-surface) 38%, transparent));
}
.mat-mdc-button.mat-mdc-button-disabled-interactive {
  pointer-events: auto;
}
.mat-mdc-button:has(.material-icons, .material-symbols-outlined, .material-symbols-rounded,
.material-symbols-sharp, mat-icon, [matButtonIcon]) {
  padding: 0 var(--mat-button-text-with-icon-horizontal-padding, 16px);
}
.mat-mdc-button > .mat-icon {
  margin-right: var(--mat-button-text-icon-spacing, 8px);
  margin-left: var(--mat-button-text-icon-offset, -4px);
}
[dir=rtl] .mat-mdc-button > .mat-icon {
  margin-right: var(--mat-button-text-icon-offset, -4px);
  margin-left: var(--mat-button-text-icon-spacing, 8px);

  .dlg-actions { display: flex; flex: none; align-items: center; gap: var(--cc-space-sm); min-height: 72px; padding: var(--cc-space-lg) var(--cc-space-xl);
                 border-block-start: 1px solid var(--cc-border); }
  .dlg-state { display: flex; flex: 1; align-items: center; gap: var(--cc-space-sm); min-width: 0; margin: 0 var(--cc-space-lg) 0 0; color: var(--cc-text-secondary); }

  .dlg-actions .mdc-button { flex: none; white-space: nowrap; }
  .step { display: flex; flex-direction: column; gap: var(--cc-space-xl); min-width: 0; }
  .group { min-width: 0; }
  .list-label { margin: 0 0 var(--cc-space-sm); color: var(--cc-text-secondary); font-size: 12px; line-height: 16px; font-weight: 500; }

  /* Editor (proposal): the category fields in one row, then the attribute table. */
  .cat-fields { display: grid; grid-template-columns: 320px 320px; gap: var(--cc-space-lg); align-items: start; padding-block-start: 6px; }
  .cat-fields .mat-mdc-form-field { width: 100%; }
  /* A locked value (composition choice 2): plain text with the lock glyph and its state line. */
  .locked { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: var(--cc-space-xs); align-items: center; min-width: 0; }

  .locked .why { grid-column: 2; color: var(--cc-text-secondary); font-size: 12px; line-height: 16px; white-space: nowrap; }
  .field-static { display: flex; flex-direction: column; justify-content: center; min-height: 56px; }
  .field-static .static-label { color: var(--cc-text-secondary); font-size: 12px; line-height: 16px; }
  .field-static .static-value { min-height: 20px; }
  .field-static .locked .why { grid-column: 2; }

  /* The attribute table: the report table of the import dialog with compact Material fields (density -4). */
  .attr-panel { border: 1px solid var(--cc-border); border-radius: var(--cc-radius-control); background: var(--cc-surface-card); }
  .attr-table { width: 100%; border-collapse: collapse; table-layout: fixed;
                --mat-form-field-container-height: 40px; --mat-form-field-container-vertical-padding: 8px; }

  .attr-table th:last-child, .attr-table td:last-child { padding-inline-end: var(--cc-space-sm); }
  .attr-table th.center, .attr-table td.center { text-align: center; }
  .attr-table .mat-mdc-form-field { width: 100%; }
  .attr-table .code input { font-family: 'Roboto Mono', monospace; }
  .attr-table col.a1 { width: 196px; } .attr-table col.a2 { width: 224px; } .attr-table col.a3 { width: 168px; }
  .attr-table col.a4 { width: 104px; } .attr-table col.a5 { width: 240px; } .attr-table col.a6 { width: 88px; }
  .attr-table th:last-child, .attr-table td:last-child { padding-inline-start: 0; }

  .attr-table .mat-mdc-form-field-subscript-wrapper { padding: 0 4px; }

  .cell-text { display: flex; align-items: center; min-height: 40px; min-width: 0; }

  .cell-text .locked { width: 100%; }
  .cell-box { display: flex; justify-content: center; align-items: center; min-height: 40px; }
  .cell-box.with-why { flex-direction: column; gap: 0; }
  .cell-box .locked-box { display: inline-flex; align-items: center; gap: var(--cc-space-xs); }
  .cell-box .why { max-width: 100%; color: var(--cc-text-secondary); font-size: 12px; line-height: 16px; text-align: center; }
  .cell-action { display: flex; justify-content: center; align-items: center; min-height: 40px; }

  tr.is-removed td { background: color-mix(in srgb, var(--cc-status-error) 6%, transparent); }

    return `<mat-checkbox class="mat-mdc-checkbox mat-accent _mat-animation-noopable${checked ? ' mat-mdc-checkbox-checked' : ''}${disabled ? ' mat-mdc-checkbox-disabled' : ''}">
      <div class="mdc-form-field mat-internal-form-field">
        <div class="mdc-checkbox${disabled ? ' mdc-checkbox--disabled' : ''}">
          <div class="mat-mdc-checkbox-touch-target" aria-hidden="true"></div>
          <input type="checkbox" class="mdc-checkbox__native-control${checked ? ' mdc-checkbox--selected' : ''}" id="${id}" aria-label="${esc(label)}"${checked ? ' checked' : ''}${disabled ? ' disabled' : ''}>
          <div class="mdc-checkbox__ripple" aria-hidden="true"></div>
          <div class="mdc-checkbox__background" aria-hidden="true"><svg class="mdc-checkbox__checkmark" focusable="false" viewBox="0 0 24 24"><path class="mdc-checkbox__checkmark-path" fill="none" d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg><div class="mdc-checkbox__mixedmark"></div></div>
          <div class="mat-mdc-checkbox-ripple mat-focus-indicator mat-ripple" aria-hidden="true"></div>
        </div>
      </div>
    </mat-checkbox>`;
  }
  // mat-form-field appearance="outline" subscriptSizing="dynamic" with matInput or mat-select.
  // label: a floating label, or '' for a table cell (the column header labels it: aria-label).
  function formField({ label = '', aria = '', value = '', select = false, focused = false, error = '', hint = '', cls = '' }) {
    const id = `mf-${++uid}`;
    const floating = label && (value.length > 0 || focused);
    const classes = ['mat-mdc-form-field', select ? 'mat-mdc-form-field-type-mat-select' : 'mat-mdc-form-field-type-mat-input', 'mat-form-field-appearance-outline', 'mat-primary'];
    if (!label) classes.push('mat-form-field-no-label');
    if (focused) classes.push('mat-focused');
    if (error) classes.push('mat-form-field-invalid');
    if (cls) classes.push(cls);
    const wrapper = ['mat-mdc-text-field-wrapper', 'mdc-text-field', 'mdc-text-field--outlined'];
    if (!label) wrapper.push('mdc-text-field--no-label');
    if (focused) wrapper.push('mdc-text-field--focused');
    if (error) wrapper.push('mdc-text-field--invalid');
    const notch = label
      ? `<div class="mat-mdc-notch-piece mdc-notched-outline__notch"><label class="mdc-floating-label mat-mdc-floating-label${floating ? ' mdc-floating-label--float-above' : ''}" id="${id}-label" for="${id}"><mat-label>${esc(label)}</mat-label></label></div>`
      : '<div class="mat-mdc-notch-piece mdc-notched-outline__notch"></div>';
    const named = label ? '' : ` aria-label="${esc(aria)}"`;
    const described = error || hint ? ` aria-describedby="${id}-sub"` : '';
    const control = select
      ? `<mat-select class="mat-mdc-select" role="combobox" aria-haspopup="listbox" id="${id}"${label ? ` aria-labelledby="${id}-label"` : named} aria-expanded="false" tabindex="0"${described}>
          <div class="mat-mdc-select-trigger"><div class="mat-mdc-select-value"><span class="mat-mdc-select-value-text"><span class="mat-mdc-select-min-line">${esc(value)}</span></span></div>
          <div class="mat-mdc-select-arrow-wrapper"><div class="mat-mdc-select-arrow"><svg viewBox="0 0 24 24" width="24px" height="24px" focusable="false" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></div></div></div></mat-select>`
      : `<input class="mat-mdc-input-element mat-mdc-form-field-input-control mdc-text-field__input" id="${id}" type="text" autocomplete="off" spellcheck="false" value="${esc(value)}"${named}${error ? ' aria-invalid="true"' : ''}${described}>`;
    const sub = error
      ? `<div class="mat-mdc-form-field-error-wrapper"><mat-error class="mat-mdc-form-field-error mat-mdc-form-field-bottom-align" id="${id}-sub">${esc(error)}</mat-error></div>`
      : hint ? `<div class="mat-mdc-form-field-hint-wrapper"><mat-hint class="mat-mdc-form-field-hint mat-mdc-form-field-bottom-align" id="${id}-sub">${esc(hint)}</mat-hint><div class="mat-mdc-form-field-hint-spacer"></div></div>` : '';
    return `<mat-form-field class="${classes.join(' ')}">
      <div class="${wrapper.join(' ')}"><div class="mat-mdc-form-field-flex">
        <div class="mdc-notched-outline mdc-notched-outline--upgraded${floating ? ' mdc-notched-outline--notched' : ''}${!label ? ' mdc-notched-outline--no-label' : ''}">
          <div class="mat-mdc-notch-piece mdc-notched-outline__leading"></div>${notch}<div class="mat-mdc-notch-piece mdc-notched-outline__trailing"></div></div>
        <div class="mat-mdc-form-field-infix">${control}</div>
      </div></div>
      <div class="mat-mdc-form-field-subscript-wrapper mat-mdc-form-field-bottom-align mat-mdc-form-field-subscript-dynamic-size">${sub}</div>
    </mat-form-field>`;
  }
  function setNotches(root) {
    // MatFormFieldNotchedOutline._setNotchWidth: label width x 0.75 + 9 px for a floating label.
    root.querySelectorAll('.mdc-notched-outline--notched').forEach((outline) => {
      const label = outline.querySelector('.mdc-floating-label');
      outline.querySelector('.mdc-notched-outline__notch').style.width = `calc(${label.scrollWidth}px * var(--mat-mdc-form-field-floating-label-scale, 0.75) + 9px)`;
    });
  }
  function tabNav(cls, label, tabs) {
    return `<nav class="mat-mdc-tab-nav-bar mat-mdc-tab-header mat-primary _mat-animation-noopable ${cls}" role="tablist" aria-label="${esc(label)}">
      <div class="mat-mdc-tab-link-container"><div class="mat-mdc-tab-list"><div class="mat-mdc-tab-links">${tabs.map((t) => `<a class="mdc-tab mat-mdc-tab-link mat-focus-indicator${t.active ? ' mdc-tab--active' : ''}" href="#" role="tab" aria-selected="${t.active}" tabindex="${t.active ? 0 : -1}">`
        + '<span class="mdc-tab__ripple"></span><div class="mat-mdc-tab-ripple mat-ripple"></div>'
        + `<span class="mdc-tab__content"><span class="mdc-tab__text-label">${esc(t.label)}${t.count === undefined ? '' : `<span class="tab-count">${n(t.count)}</span>`}</span></span>`
        + `<span class="mdc-tab-indicator${t.active ? ' mdc-tab-indicator--active' : ''}"><span class="mdc-tab-indicator__content mdc-tab-indicator__content--underline"></span></span></a>`).join('')}</div></div></div></nav>`;
  }
  function progressBar(percent, label) {
    return `<mat-progress-bar class="mat-mdc-progress-bar mdc-linear-progress mat-primary _mat-animation-noopable" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" aria-label="${esc(label)}" mode="determinate" tabindex="-1">`
      + '<div class="mdc-linear-progress__buffer" aria-hidden="true"><div class="mdc-linear-progress__buffer-bar" style="flex-basis: 100%"></div></div>'
      + `<div class="mdc-linear-progress__bar mdc-linear-progress__primary-bar" aria-hidden="true" style="transform: scaleX(${percent / 100})"><span class="mdc-linear-progress__bar-inner"></span></div>`
      + '<div class="mdc-linear-progress__bar mdc-linear-progress__secondary-bar" aria-hidden="true"><span class="mdc-linear-progress__bar-inner"></span></div></mat-progress-bar>';

  // ---------- Scenario data (baseline section 7, item 13, and brief B) ----------
  const ADMINS = 'Admins and the user';

  const FIXED = 'Fixed at creation';
  const CATEGORIES = [

    { name: 'Staff information', key: 'StaffInfo', users: 286, changed: null,
      attrs: [['Employee ID', 'EmployeeId', 'Text', false, ADMINS, true], ['Building', 'Building', 'Text', false, EVERYONE, true],
        ['Hire date', 'HireDate', 'Date', false, ADMINS, true], ['Certifications', 'Certifications', 'Text', true, ADMINS, true]] },
    { name: 'Student information', key: 'StudentInfo', users: 2104, changed: 'Sep 8, 2026',
      attrs: [['Student ID', 'StudentId', 'Text', false, ADMINS, true], ['Grade level', 'GradeLevel', 'Whole number', false, ADMINS, true],
        ['Graduation year', 'GraduationYear', 'Whole number', false, ADMINS, true], ['Homeroom', 'Homeroom', 'Text', false, ADMINS, true],
        ['Programs', 'Programs', 'Text', true, ADMINS, true]] },

  const ATTRIBUTE_LIMIT = 100;
  const CATEGORY_LIMIT = 100;
  const attributesUsed = CATEGORIES.reduce((sum, c) => sum + c.attrs.length, 0);
  if (attributesUsed !== 10) throw new Error(`the scenario holds 10 attributes, not ${attributesUsed}`);
  const HOMEROOM_USERS = 1988;
  const byKey = (key) => CATEGORIES.find((c) => c.key === key);

  // ---------- Shell (shell.html) ----------
  const NAV = [['laptop_chromebook', 'Devices'], ['group', 'Users'], ['history', 'Jobs'], ['domain', 'Google connection'],
    ['settings', 'Customer settings'], ['account_circle', 'Your account'], ['monitor_heart', 'Diagnostics'], ['school', 'Schools'],
    ['manage_accounts', 'Platform access'], ['person_add', 'Platform invitations']];
  function shell(content, { person = 'Review administrator', running = false } = {}) {
    const links = NAV.map(([glyph, label]) => `<a href="#" class="${label === 'Users' ? 'active' : ''}"${label === 'Users' ? ' aria-current="page"' : ''} aria-label="${esc(label)}">${matIcon(glyph)}<span class="nav-label">${esc(label)}</span></a>`).join('');
    const bell = `<div class="activity">${iconButton('notifications', running ? 'Activity, 1 job running' : 'Activity', {

    return `<div class="shell">

        <div class="nav-heading">${iconButton('menu', 'Toggle navigation', { attrs: 'aria-expanded="true"' })}<span class="nav-label wordmark">Campus Commander</span></div>

      <header><span class="header-title">Users</span>
        <div class="header-actions">${bell}${iconButton('help', 'Help', { tag: 'a' })}${iconButton('contrast', 'Choose theme')}

        </div>
      </header>
      <main id="main-content" tabindex="-1">
        <p class="review-notice" role="note"><strong>Development review.</strong> Google sign-in and Workspace data are simulated. Use the sample service-account file. Do not upload real credentials.</p>
        ${content}
      </main>
      <footer><span>Version development · Build client-review</span><a href="#">Services ready</a><a href="#">Google results are out of date</a></footer>
    </div>`;
  }

  // ---------- The Custom attributes tab (brief B, "Page under every state") ----------
  function limitsLine(categories, attributes) {
    return `<p class="limits-line" role="status">${n(categories)} of ${CATEGORY_LIMIT} categories used · ${n(attributes)} of ${ATTRIBUTE_LIMIT} attributes used</p>`;
  }
  function categoryGrid(rows) {
    const rz = '<span class="rz" aria-hidden="true"></span>';
    const body = rows.map((c) => `<tr><td><a class="cat-link" href="#" aria-label="${esc(`Open category ${c.name}`)}">${esc(c.name)}</a></td>
      <td><span class="code">${esc(c.key)}</span></td><td class="num">${n(c.attrs.length)}</td><td class="num">${n(c.users)}</td>
      <td${c.changed ? '' : ' class="muted"'}>${esc(c.changed || 'Not recorded')}</td></tr>`).join('');
    return `<div class="grid-region"><table class="cat-grid" aria-label="Categories"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col></colgroup>
      <thead><tr><th scope="col" aria-sort="ascending"><span class="th-in"><span>Category</span>${icon('arrow_upward', 's18')}</span>${rz}</th><th scope="col"><span class="th-in"><span>Category name</span></span>${rz}</th>
      <th scope="col" class="num"><span class="th-in"><span>Attributes</span></span>${rz}</th><th scope="col" class="num"><span class="th-in"><span>Users with values</span></span>${rz}</th>
      <th scope="col"><span class="th-in"><span>Last changed</span></span></th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function usersPage({ canManage = true, empty = false } = {}) {
    const tabs = tabNav('page-tabs', 'Users views', [{ label: 'Users', active: false }, { label: 'Custom attributes', active: true }]);
    const help = iconButton('info', 'Custom attributes help');
    const create = canManage && !empty ? button('Create category', { lead: 'add' }) : '';
    const panel = empty
      ? `<div class="filter-row"><div class="actions"></div><div class="actions">${help}</div></div>${limitsLine(0, 0)}
         <section class="card empty-card" aria-labelledby="empty-title"><h2 id="empty-title">No categories yet</h2>
         <p>Google Workspace holds no custom attribute categories for this domain.</p>${button('Create category', { lead: 'add' })}</section>`
      : `<div class="filter-row"><div class="actions">${create}</div><div class="actions">${help}</div></div>
         ${limitsLine(CATEGORIES.length, attributesUsed)}${categoryGrid(CATEGORIES)}`;
    return `<div class="users"><header class="page-header"><h1>Users</h1><p class="subtitle">Google Workspace accounts</p></header>
      ${tabs}<section class="tab-panel" role="tabpanel" aria-label="Custom attributes">${panel}</section></div>`;
  }

  // ---------- The category dialog ----------
  function dialog({ wide = true, title, sub = '', body, state = '', lead = '', actions }) {
    const subLine = sub ? `<p class="dlg-sub" id="dlg-sub">${sub}</p>` : '';
    return `<div class="picker-scrim"></div><div class="picker-wrap"><section class="dlg${wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title"${sub ? ' aria-describedby="dlg-sub"' : ''}>
      <header class="dlg-head"><div class="dlg-titles"><h2 id="dlg-title">${esc(title)}</h2>${subLine}</div>
        <div class="dlg-tools">${iconButton('info', 'Custom attributes help', { attrs: 'aria-expanded="false"' })}${iconButton('close', 'Close')}</div></header>
      <div class="dlg-main"><div class="dlg-body">${body}</div></div>
      <div class="dlg-actions">${lead}<div class="dlg-state${state.startsWith('!') ? ' error' : ''}" role="status">${state.replace(/^!/, '')}</div>${actions}</div>
    </section></div>`;
  }
  const jobLink = (id) => `<a href="#" aria-label="${esc(`Open job ${id}`)}">${esc(id)}</a>`;
  const lockedText = (value, why = FIXED, { code = false } = {}) => `<span class="locked">${icon('lock', 's16')}<span class="val${code ? ' code' : ''}">${esc(value)}</span><span class="why">${esc(why)}</span></span>`;

  // One attribute row. kind: new | existing | removed | readonly.
  // a = { display, name, type, multi, visibility, searchable, errors: { name }, changed: { visibility } }
  function attrRow(a, kind) {
    const label = a.display;
    const cells = [];
    if (kind === 'removed') {
      cells.push(`<div class="rm-cell"><span class="rm-name">${esc(a.display)}</span><span class="rm-line">${esc(`Removes values from ${n(a.users)} users`)}</span></div>`);
      cells.push(`<div class="cell-text"><span class="val code">${esc(a.name)}</span></div>`);
      cells.push(`<div class="cell-text"><span class="val">${esc(a.type)}</span></div>`);
      cells.push(`<div class="cell-box">${checkbox(`Multiple values for ${label}`, { checked: a.multi, disabled: true })}</div>`);
      cells.push(`<div class="cell-text"><span class="val">${esc(a.visibility)}</span></div>`);
      cells.push(`<div class="cell-box">${checkbox(`Searchable ${label}`, { checked: a.searchable, disabled: true })}</div>`);
      cells.push(`<div class="cell-action">${iconButton('undo', `Keep attribute ${label}`)}</div>`);
      return `<tr class="is-removed">${cells.map((c) => `<td>${c}</td>`).join('')}</tr>`;
    }
    if (kind === 'readonly') {
      cells.push(`<div class="cell-text"><span>${esc(a.display)}</span></div>`);
      cells.push(`<div class="cell-text"><span class="code">${esc(a.name)}</span></div>`);
      cells.push(`<div class="cell-text"><span>${esc(a.type)}</span></div>`);
      cells.push(`<div class="cell-box">${checkbox(`Multiple values for ${label}`, { checked: a.multi, disabled: true })}</div>`);
      cells.push(`<div class="cell-text"><span>${esc(a.visibility)}</span></div>`);
      cells.push(`<div class="cell-box">${checkbox(`Searchable ${label}`, { checked: a.searchable, disabled: true })}</div>`);
      cells.push('');
      return `<tr>${cells.map((c) => `<td>${c}</td>`).join('')}</tr>`;
    }
    const errors = a.errors || {};
    cells.push(formField({ aria: 'Display name', value: a.display }));
    if (kind === 'new') {
      cells.push(formField({ aria: 'Attribute name', value: a.name, error: errors.name || '', cls: 'code' }));
      cells.push(formField({ aria: 'Info type', value: a.type, select: true }));
      cells.push(`<div class="cell-box">${checkbox(`Multiple values for ${label}`, { checked: a.multi })}</div>`);
    } else {
      cells.push(`<div class="cell-text">${lockedText(a.name, FIXED, { code: true })}</div>`);
      cells.push(`<div class="cell-text">${lockedText(a.type)}</div>`);
      cells.push(a.multi
        ? `<div class="cell-box with-why"><span class="locked-box">${icon('lock', 's16')}${checkbox(`Multiple values for ${label}`, { checked: true, disabled: true })}</span><span class="why">Cannot return to one value</span></div>`
        : `<div class="cell-box">${checkbox(`Multiple values for ${label}`, { checked: false })}</div>`);
    }
    const changed = (a.changed || {}).visibility;
    cells.push(formField({ aria: 'Visibility', value: a.visibility, select: true, cls: changed ? 'is-changed' : '' }));
    cells.push(`<div class="cell-box">${checkbox(`Searchable ${label}`, { checked: a.searchable })}</div>`);
    cells.push(`<div class="cell-action">${iconButton('delete', `Remove attribute ${label}`)}</div>`);
    return `<tr>${cells.map((c) => `<td>${c}</td>`).join('')}</tr>`;
  }
  function attrTable(rows) {
    return `<div class="attr-panel"><table class="attr-table" aria-label="Attributes"><colgroup><col class="a1"><col class="a2"><col class="a3"><col class="a4"><col class="a5"><col class="a6"><col class="a7"></colgroup>
      <thead><tr><th scope="col">Display name</th><th scope="col">Attribute name</th><th scope="col">Info type</th><th scope="col" class="center">Multiple values</th>
      <th scope="col">Visibility</th><th scope="col" class="center">Searchable</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr></thead>
      <tbody>${rows.map(([a, kind]) => attrRow(a, kind)).join('')}</tbody></table></div>`;
  }
  const fromCategory = (key) => byKey(key).attrs.map(([display, name, type, multi, visibility, searchable]) => ({ display, name, type, multi, visibility, searchable }));
  const newAttr = (display, name, type, extra = {}) => ({ display, name, type, multi: false, visibility: ADMINS, searchable: true, ...extra });
  function addRow({ disabled = false, line = '', lineClass = '' }) {
    return `<div class="add-row">${button('Add attribute', { kind: 'text', lead: 'add', disabled })}${line ? `<span class="limit-line${lineClass ? ` ${lineClass}` : ''}" role="status">${esc(line)}</span>` : ''}</div>`;
  }
  function editorBody({ display, keyField, rows, add, after = '' }) {
    return `<div class="step"><div class="cat-fields">${formField({ label: 'Display name', value: display })}${keyField}</div>
      <section class="group" aria-labelledby="attrs-label"><p class="list-label" id="attrs-label">Attributes</p>${attrTable(rows)}${add}${after}</section></div>`;
  }
  const staticField = (label, valueHtml) => `<div class="field-static"><span class="static-label">${esc(label)}</span><span class="static-value">${valueHtml}</span></div>`;
  const usedAfter = (count) => `${n(count)} of ${ATTRIBUTE_LIMIT} attributes used after this change`;
  // Edit states: Delete category leads the action bar (composition choice 5), the review action ends it.
  const deleteLead = button('Delete category', { kind: 'outlined', destructive: true, cls: 'delete-trigger' });
  const editActions = (review = true) => button('Cancel', { kind: 'text' }) + button('Review changes', { disabled: !review });

  // ---------- States ----------
  const createRows02 = [newAttr('Bus route', 'BusRoute', 'Text'), newAttr('Stop name', 'StopName', 'Text'), newAttr('Rider', 'Rider', 'Yes or no')];
  const createRows03 = [newAttr('Bus route', 'BusRoute', 'Text'), newAttr('Stop name', 'Stop #', 'Text', { errors: { name: 'Use letters, digits, _\u00a0and\u00a0-\u00a0only.' } }),
    newAttr('Rider', 'Rider', 'Yes or no'), newAttr('Rider', 'Rider', 'Yes or no', { errors: { name: 'Each attribute needs a unique name.' } })];
  function studentRows({ remove = false, counselor = false } = {}) {
    const rows = fromCategory('StudentInfo').map((a) => (remove && a.name === 'Homeroom' ? [{ ...a, users: HOMEROOM_USERS }, 'removed'] : [a, 'existing']));
    if (counselor) rows.push([newAttr('Counselor', 'Counselor', 'Email'), 'new']);
    return rows;
  }
  const CHANGES = [
    { kind: 'Add attribute', tone: 'success', attr: 'Counselor (Email)', effect: 'No user values change' },
    { kind: 'Remove attribute', tone: 'error', attr: 'Homeroom (Text)', effect: `Deletes its values on ${n(HOMEROOM_USERS)} users` },
  ];
  function changeTable(outcome) {
    const head = `<th scope="col">Change</th><th scope="col">Attribute</th><th scope="col">Effect</th>${outcome ? '<th scope="col">Outcome</th>' : ''}`;
    const rows = CHANGES.map((c) => `<tr><td><span class="change-chip tone-${c.tone}"><span class="dot" aria-hidden="true"></span>${esc(c.kind)}</span></td>
      <td>${esc(c.attr)}</td><td>${esc(c.effect)}</td>${outcome ? '<td><span class="status-chip tone-success"><span class="dot" aria-hidden="true"></span>Succeeded</span></td>' : ''}</tr>`).join('');
    return `<table class="report-table" aria-label="Changes"><colgroup><col class="r1"><col class="r2"><col>${outcome ? '<col class="r4">' : ''}</colgroup><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  const domainLine = `<p class="state-line">${icon('domain', 's20')}<span>The changes apply to every user in the domain.</span></p>`;
  const keyInput = (value, extra = {}) => formField({ label: 'Category name', value, cls: 'code', ...extra });

  const STATE_DEFS = {
    '01-categories-list': () => ({ page: {} }),
    '02-create-category': () => ({ page: {}, dlg: { title: 'Create category',
      body: editorBody({ display: 'Transportation', keyField: keyInput('Transportation', { hint: 'Locks after the first save' }),
        rows: createRows02.map((a) => [a, 'new']), add: addRow({ line: usedAfter(attributesUsed + 3) }) }),
      actions: button('Cancel', { kind: 'text' }) + button('Review changes') } }),
    '03-create-errors': () => ({ page: {}, dlg: { title: 'Create category', state: '!3 fields have errors',
      body: editorBody({ display: 'Transportation', keyField: keyInput('StudentInfo', { error: 'A category with this name exists.' }),
        rows: createRows03.map((a) => [a, 'new']), add: addRow({ line: usedAfter(attributesUsed + 4) }) }),
      actions: button('Cancel', { kind: 'text' }) + button('Review changes', { disabled: true }) } }),
    '04-edit-category': () => ({ page: {}, dlg: { title: 'Edit category', sub: 'Student information',
      body: editorBody({ display: 'Student information', keyField: staticField('Category name', lockedText('StudentInfo', FIXED, { code: true })),
        rows: studentRows({ remove: true, counselor: true }), add: addRow({ line: usedAfter(attributesUsed) }) }),
      lead: deleteLead, actions: editActions() } }),
    '05-review-changes': () => ({ page: {}, dlg: { title: 'Edit category', sub: 'Student information',
      body: `<div class="step report-step"><div><p class="change-line">2 changes to Student information</p>${domainLine}</div>
        <div class="report-panel">${changeTable(false)}</div>
        <div class="gate"><section class="one-way" aria-labelledby="one-way-title"><div class="one-way-head" id="one-way-title">${icon('warning', 's20')}<span>Remove attribute</span><span class="sep" aria-hidden="true">·</span><span>Homeroom</span></div>
          <p>${esc(`Removing Homeroom deletes its values on ${n(HOMEROOM_USERS)} users. Nothing restores them.`)}</p></section>
          ${formField({ label: 'Type Homeroom to confirm', value: '' })}</div></div>`,
      actions: button('Back to editing', { kind: 'text' }) + button('Save 2 changes', { disabled: true }) } }),
    '06-saving': () => ({ running: true, page: {}, dlg: { wide: false, title: 'Edit category', sub: `Job ${jobLink('CAT-003')} · Running`,
      body: `<div class="step"><ol class="phases" aria-label="Progress">
        <li class="phase is-current"><span class="phase-rule" aria-hidden="true"></span><span class="phase-dot" aria-hidden="true">1</span><span class="phase-label">Save changes in Google</span><span class="phase-detail">0 of 2</span>${progressBar(0, 'Save changes in Google')}</li>
        <li class="phase"><span class="phase-dot" aria-hidden="true">2</span><span class="phase-label">Update cached users</span><span class="phase-detail"></span></li></ol></div>`,
      state: `<span class="quiet">${icon('info', 's16')}<span>Closing this dialog keeps the save running.</span></span>`,
      actions: button('Close') } }),
    '07-saved': () => ({ page: {}, dlg: { title: 'Edit category', sub: `Job ${jobLink('CAT-003')} · Completed · Student information`,
      body: `<div class="step report-step"><section aria-labelledby="rs-title"><h3 id="rs-title" class="visually-hidden">Result counts</h3>
        <dl class="count-equation" aria-label="Changes"><div class="count-term tone-info"><dd>2</dd><dt>Changes</dt></div><span class="count-sign" aria-hidden="true">=</span>
        <div class="count-term tone-success"><dd>2</dd><dt>Succeeded</dt></div><span class="count-sign" aria-hidden="true">+</span><div class="count-term"><dd>0</dd><dt>Failed</dt></div></dl>${domainLine}</section>
        <div class="report-panel"><div class="report-views">${tabNav('report-tabs', 'Results view', [{ label: 'All changes', count: 2, active: true }, { label: 'Failed', count: 0, active: false }])}</div>${changeTable(true)}</div></div>`,
      state: '<span>Finished Nov 1, 9:31 AM</span>',
      actions: button('Close') } }),
    '08-delete-category': () => ({ page: {}, dlg: { wide: false, title: 'Delete category', sub: 'Device program',
      body: `<div class="step"><div class="gate"><section class="one-way" aria-labelledby="one-way-title"><div class="one-way-head" id="one-way-title">${icon('warning', 's20')}<span>Delete category</span><span class="sep" aria-hidden="true">·</span><span>Device program</span></div>
        <p>${esc(`Deletes Take-home approved values on ${n(1312)} users.`)}</p><p>The change applies to every user in the domain.</p></section>
        ${formField({ label: 'Type Device program to confirm', value: 'Device program', focused: true })}</div></div>`,
      actions: button('Cancel', { kind: 'text' }) + button('Delete category', { destructive: true }) } }),
    '09-read-only': () => ({ person: 'Review recipient', page: { canManage: false }, dlg: { title: 'Student information',
      body: `<div class="step"><div class="cat-fields">${staticField('Display name', '<span>Student information</span>')}${staticField('Category name', '<span class="code">StudentInfo</span>')}</div>
        <section class="group" aria-labelledby="attrs-label"><p class="list-label" id="attrs-label">Attributes</p>${attrTable(fromCategory('StudentInfo').map((a) => [a, 'readonly']))}
        ${addRow({ disabled: true, line: 'Requires the User Schema Manage permission.' })}</section></div>`,
      actions: button('Close') } }),
    '10-limit-reached': () => ({ page: {}, dlg: { title: 'Edit category', sub: 'Student information',
      body: editorBody({ display: 'Student information', keyField: staticField('Category name', lockedText('StudentInfo', FIXED, { code: true })),
        rows: studentRows(), add: addRow({ disabled: true, line: '100 of 100 attributes used. Remove an attribute before you add one.' }) }),
      lead: deleteLead, actions: editActions(false) } }),
    '11-empty': () => ({ page: { empty: true } }),
    '12-visibility-change': () => ({ page: {}, dlg: { title: 'Edit category', sub: 'Staff information',
      body: editorBody({ display: 'Staff information', keyField: staticField('Category name', lockedText('StaffInfo', FIXED, { code: true })),
        rows: fromCategory('StaffInfo').map((a) => (a.name === 'Building' ? [{ ...a, visibility: ADMINS, changed: { visibility: true } }, 'existing'] : [a, 'existing'])),
        add: addRow({ line: usedAfter(attributesUsed) }),
        after: `<p class="state-line">${icon('schedule', 's20')}<span>Google can take up to 24 hours to apply a visibility change.</span></p>` }),
      lead: deleteLead, actions: editActions() } }),
  };
  const STATES = Object.keys(STATE_DEFS);

  function render(name) {
    const def = STATE_DEFS[name]();
    const content = usersPage(def.page);
    const overlay = def.dlg ? dialog(def.dlg) : '';
    return shell(content, { person: def.person, running: def.running }) + overlay;
  }
  function show(name) {
    if (!STATE_DEFS[name]) throw new Error(`unknown state ${name}`);
    uid = 0;
    const app = document.getElementById('app');
    app.innerHTML = render(name);
    app.setAttribute('data-state', name);
    setNotches(app);
    document.title = `${name}: Custom attributes proposal (Campus Commander)`;
    switcher.update(name);
  }

  // ---------- State switcher: a shadow root, so a snapshot of the page never holds it ----------
  const switcher = (() => {
    const host = document.querySelector('mock-switcher');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = `<style>
      :host { font: 400 11px/14px Roboto, sans-serif; color: #5b3a00; }
      details { background: #fff8e1; border: 1px dashed #b06000; border-radius: 8px; box-shadow: 0 2px 6px rgba(32, 33, 36, 0.12); }
      summary { cursor: pointer; padding: 6px 10px; font-weight: 500; }
      ul { margin: 0; padding: 4px 6px 6px; list-style: none; display: grid; gap: 2px; }
      a { display: block; padding: 2px 6px; border-radius: 4px; color: #5b3a00; text-decoration: none; white-space: nowrap; }
      a[aria-current] { background: #5b3a00; color: #ffffff; }
    </style><details><summary>Mockup states</summary><ul>${STATES.map((s) => `<li><a href="#${s}">${s}</a></li>`).join('')}</ul></details>`;
    return { update(name) { root.querySelectorAll('a').forEach((a) => a.toggleAttribute('aria-current', a.getAttribute('href') === `#${name}`)); } };
  })();

  window.mockup = { STATES, show, render, icon };
  const fromHash = () => {
    const name = decodeURIComponent(location.hash.replace(/^#/, ''));
    show(STATE_DEFS[name] ? name : STATES[0]);
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
