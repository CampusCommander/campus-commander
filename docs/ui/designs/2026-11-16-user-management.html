  /* Angular Material 22 component CSS (work/material/extract.py). */
/* Angular Material 22.2.2, _structural-styles-chunk.mjs */
.mat-focus-indicator {
  position: relative;
}
.mat-focus-indicator::before {
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  position: absolute;
  box-sizing: border-box;
  pointer-events: none;
  display: var(--mat-focus-indicator-display, none);
  border-width: var(--mat-focus-indicator-border-width, 3px);
  border-style: var(--mat-focus-indicator-border-style, solid);
  border-color: var(--mat-focus-indicator-border-color, transparent);
  border-radius: var(--mat-focus-indicator-border-radius, 4px);
}
.mat-focus-indicator:focus-visible::before {
  content: "";
}

@media (forced-colors: active) {
  html {
    --mat-focus-indicator-display: block;
    --mat-focus-indicator-fallback-border-style: none;
  }
}


/* Angular Material 22.2.2, _ripple-chunk.mjs */
.mat-ripple {
  overflow: hidden;
  position: relative;
}
.mat-ripple:not(:empty) {
  transform: translateZ(0);
}

.mat-ripple.mat-ripple-unbounded {
  overflow: visible;
}

.mat-ripple-element {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transition: opacity, transform 0ms cubic-bezier(0, 0, 0.2, 1);
  transform: scale3d(0, 0, 0);
  background-color: var(--mat-ripple-color, color-mix(in srgb, var(--mat-sys-on-surface) 10%, transparent));
}
@media (forced-colors: active) {
  .mat-ripple-element {
    display: none;
  }
}
.cdk-drag-preview .mat-ripple-element, .cdk-drag-placeholder .mat-ripple-element {
  display: none;
}


/* Angular Material 22.2.2, _internal-form-field-chunk.mjs */
.mat-internal-form-field {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
}
.mat-internal-form-field > label, .mat-internal-form-field > .mat-internal-form-field-label {
  margin-left: 0;
  margin-right: auto;
  padding-left: 4px;
  padding-right: 0;
  order: 0;
}
[dir=rtl] .mat-internal-form-field > label, [dir=rtl] .mat-internal-form-field > .mat-internal-form-field-label {
  margin-left: auto;
  margin-right: 0;
  padding-left: 0;
  padding-right: 4px;
}

.mdc-form-field--align-end > label, .mdc-form-field--align-end > .mat-internal-form-field-label {
  margin-left: auto;
  margin-right: 0;
  padding-left: 0;
  padding-right: 4px;

    const head = `<div class="card-head"><h2 id="attr-title">Custom attributes</h2>${mode === 'read' ? button('Edit', { kind: 'outlined', attrs: 'data-go="05-user-details-edit"' }) : ''}</div>`;
    const attrs = `<section class="card attrs" aria-labelledby="attr-title">${head}${savedLine}${body}</section>`;
    return `<div class="detail"><header class="page-header"><h1>${esc(u.name)}</h1><p class="subtitle">User details · ${esc(u.ou)}</p></header>
      <div class="actions">${button('Back to users', { kind: 'outlined', attrs: 'data-go="01-users-grid"' })}${button('Next user', { kind: 'outlined', attrs: 'data-noop' })}</div>
      <div class="detail-layout">${account}${org}${attrs}</div></div>`;
  }

  // ---------- The Set attributes dialog ----------
  const SUB_SETUP = '25 selected users';
  function dialogShell({ narrow, title, sub, body, left = '', actions }) {
    return `<div id="wd"><div class="picker-scrim" aria-hidden="true"></div><div class="wd-wrap"><section class="wd${narrow ? ' is-narrow' : ''}" role="dialog" aria-modal="true" aria-labelledby="wd-title">
      <div class="wd-head"><div class="wd-titles"><h2 id="wd-title">${esc(title)}</h2>${sub}</div><div class="wd-tools">${iconButton('info', 'Help for Set attributes')}${iconButton('close', 'Close')}</div></div>
      <div class="wd-body">${body}</div><div class="wd-actions"><div class="wd-state">${left}</div>${actions}</div></section></div></div>`;
  }
  function setupDialog(single = false) {
    const attr = single ? formField({ label: 'Attribute', value: 'Homeroom', kind: 'select', hint: 'Text · Single value' })
      : formField({ label: 'Attribute', value: 'Programs', kind: 'select', hint: 'Text · Multiple values' });
    const modes = single ? [['set', 'Set value', true], ['clear', 'Clear value', false]]
      : [['add', 'Add values', true], ['remove', 'Remove values', false], ['replace', 'Replace all values', false], ['clear', 'Clear values', false]];
    const value = single ? formField({ label: 'Value', value: '216' }) : formField({ label: 'Values', kind: 'chips', chips: [ADD] });
    const body = `<div class="step">${formField({ label: 'Category', value: 'Student information', kind: 'select' })}${attr}`
      + `<section class="group"><p class="list-label" id="mode-label">Mode</p>${optionCards('mode-label', modes.map(([v, l, on]) => radio('mode', v, l, { checked: on })).join(''), 'cols-2')}</section>${value}</div>`;
    return dialogShell({ narrow: true, title: 'Set attributes', sub: `<p class="wd-sub">${esc(SUB_SETUP)}</p>`, body,
      actions: button('Cancel', { kind: 'text', attrs: 'data-go="07-bulk-actions-menu"' }) + button('Review', { attrs: single ? 'data-noop' : 'data-go="09-set-attributes-review"' }) });
  }
  const PAGE = 10;
  const userCell = (u) => `<span class="user-cell"><a class="details" href="#" data-noop aria-label="${esc(`Open details for ${u.name}`)}">${ic('visibility')}</a>${tok(u.name)}</span>`;
  const valueText = (values) => values.length ? esc(values.join(', ')) : '<span class="not-set">Not set</span>';
  const newValue = (u) => `<span class="val-new">${ic('arrow_forward')}<span>${esc([...u.programs, ADD].join(', '))}</span></span>`;
  function term(label, count, tone = '') { return `<div class="term${tone ? ` tone-${tone}` : ''}"><dt>${esc(label)}</dt><dd>${n(count)}</dd></div>`; }
  const op = (sign) => `<span class="op" aria-hidden="true">${sign}</span>`;
  function tableFooter(text, pages) {
    return `<footer class="grid-footer"><span class="footer-count" role="status">${esc(text)}</span><div class="footer-paging">`
      + `<button type="button" class="page-button" aria-label="Previous results page" disabled>${ic('chevron_left')}</button>`
      + `<button type="button" class="page-button" aria-label="Next results page"${pages > 1 ? '' : ' disabled'}>${ic('chevron_right')}</button></div></footer>`;
  }
  function reviewDialog() {
    const rows = PROPOSED.slice(0, PAGE).map((u) => `<tr><td>${userCell(u)}</td><td>${tok(u.email)}</td><td class="val-current">${valueText(u.programs)}</td><td>${newValue(u)}</td></tr>`).join('');
    const body = `<div class="rp"><section aria-labelledby="rv-counts"><h3 id="rv-counts" class="visually-hidden">Review counts</h3>`
      + `<dl class="equation">${term('Users', SELECTED.length)}${op('=')}${term('No change needed', NO_CHANGE.length)}${op('+')}${term('Proposed', PROPOSED.length)}</dl>`
      + `<p class="rp-change">Programs · Add values · ESL</p></section>`
      + `<div class="rp-panel"><div class="rp-views">${tabBar('Review view', [{ key: 'p', label: 'Proposed', count: PROPOSED.length }, { key: 'n', label: 'No change needed', count: NO_CHANGE.length }], 'p')}</div>`
      + `<table class="rp-table rv" aria-label="Proposed changes"><colgroup><col class="c-user"><col class="c-mail"><col><col></colgroup>`
      + `<thead><tr><th scope="col">User</th><th scope="col">Primary email</th><th scope="col">Current value</th><th scope="col">New value</th></tr></thead><tbody>${rows}</tbody></table>`
      + `${tableFooter(`1–${PAGE} of ${PROPOSED.length} proposed changes`, 2)}</div></div>`;
    return dialogShell({ title: 'Set attributes', sub: `<p class="wd-sub">${esc(`${SUB_SETUP} · Student information · Programs`)}</p>`, body,
      actions: button('Back', { kind: 'outlined', attrs: 'data-go="08-set-attributes-dialog"' }) + button(`Set attributes on ${PROPOSED.length} users`, { attrs: 'data-go="10-set-attributes-results"' }) });
  }
  function resultsDialog() {
    const failed = PROPOSED.filter((u) => FAILED[u.name]).length;
    const ok = PROPOSED.length - failed;
    const rows = PROPOSED.slice(0, PAGE).map((u) => {
      const reason = FAILED[u.name];
      const outcome = reason ? `${chipTone('Failed', 'error')}<span class="outcome-reason">${esc(reason)}</span>` : chipTone('Succeeded', 'success');
      return `<tr><td>${userCell(u)}</td><td>${tok(u.email)}</td><td class="val-current">${valueText(u.programs)}</td><td>${newValue(u)}</td><td>${outcome}</td></tr>`;
    }).join('');
    const job = `<section class="jobs-band" aria-label="Job of this change"><ul class="job-items"><li class="job-item"><a class="job-link" href="#" data-noop aria-label="Open details for job UAT-014">UAT-014</a>`
      + `<span>Set attributes</span><span>${chipTone('Completed with errors', 'error')}</span><ul class="meta-items"><li>${ok} succeeded</li><li class="sepdot" aria-hidden="true">·</li><li>${failed} failed</li></ul></li></ul></section>`;
    const body = `<div class="rp rs"><section class="rs-sum" aria-labelledby="rs-counts"><h3 id="rs-counts" class="visually-hidden">Result counts</h3>`
      + `<dl class="equation">${term('changes', PROPOSED.length)}${op('=')}${term('Succeeded', ok, 'success')}${op('+')}${term('Failed', failed, 'error')}</dl><p class="rs-ended">Finished Nov 1, 9:41 AM</p></section>${job}`
      + `<div class="rp-panel"><div class="rp-views">${tabBar('Results view', [{ key: 'all', label: 'All', count: PROPOSED.length }, { key: 'failed', label: 'Failed', count: failed, tone: 'error' }], 'all')}</div>`
      + `<table class="rp-table rs" aria-label="Results"><colgroup><col class="c-user"><col class="c-mail"><col><col><col class="c-out"></colgroup>`
      + `<thead><tr><th scope="col">User</th><th scope="col">Primary email</th><th scope="col">Current value</th><th scope="col">New value</th><th scope="col">Outcome</th></tr></thead><tbody>${rows}</tbody></table>`
      + `${tableFooter(`1–${PAGE} of ${PROPOSED.length} changes`, 2)}</div></div>`;
    return dialogShell({ title: 'Set attributes', sub: `<p class="wd-sub">Job <a href="#" data-noop>UAT-014</a> · Completed with errors</p>`, body,
      left: '<span>Executed by Review administrator · Nov 1, 9:41 AM</span>', actions: button('Done', { attrs: 'data-go="01-users-grid"' }) });
  }

  // ---------- States ----------
  const base = (extra) => ({ page: 'users', ...extra });
  const g01 = () => ({ rows: FIRST, cols: DEFAULT_COLS, sort: 'name', status: status(DISTRICT, 0, 0), paging: paging(DISTRICT) });
  const sel07 = new Set(SELECTED.map((u) => u.name));
  const g07 = () => ({ rows: GRADE10, cols: DEFAULT_COLS, sort: 'name', selected: sel07, someChecked: true, status: status(164, 25, 25, 164), paging: paging(164) });
  const CHIPS07 = ['Organization unit · /Students/High School', 'Grade level 10'];
  const STATES = {
    '01-users-grid': () => base({ users: { note: NOTE, grid: g01() } }),
    '02-columns-panel': () => base({ users: { note: NOTE, grid: { ...g01(), cols: [...DEFAULT_COLS, 'grade', 'programs'], scroll: 715, panel: true } } }),
    '03-attribute-filter': () => base({ users: { note: NOTE, chips: ['Grade level 9 to 12'], editor: rangeEditor(),
      grid: { rows: GRADES, cols: [...DEFAULT_COLS, 'grade', 'programs'], scroll: 420, sort: 'name', filtered: 'grade', status: status(612), paging: paging(612) } } }),
    '04-user-details': () => ({ page: 'details', mode: 'read' }),
    '05-user-details-edit': () => ({ page: 'details', mode: 'edit' }),
    '06-in-grid-pending': () => base({ users: { draftBar: '2 pending changes · 2 users',
      grid: { ...g01(), cols: [...DEFAULT_COLS, 'grade', 'homeroom'], scroll: 420, drafts: { 'Alejandro Ruiz': { grade: '11' }, 'Aisha Rahman': { homeroom: '216' } } } } }),
    '07-bulk-actions-menu': () => base({ users: { chips: CHIPS07, menu: true, grid: g07() } }),
    '08-set-attributes-dialog': () => base({ vp: true, users: { chips: CHIPS07, grid: g07() }, dialog: () => setupDialog(false) }),
    '09-set-attributes-review': () => base({ vp: true, users: { chips: CHIPS07, grid: g07() }, dialog: reviewDialog }),
    '10-set-attributes-results': () => base({ vp: true, users: { chips: CHIPS07, grid: g07() }, dialog: resultsDialog }),
    '11-set-attributes-single-value': () => base({ vp: true, users: { chips: CHIPS07, grid: g07() }, dialog: () => setupDialog(true) }),
    '12-details-saved': () => ({ page: 'details', mode: 'read', saved: true }),
    '13-no-matches': () => base({ users: { note: NOTE, chips: ['Homeroom is: 999'], noMatches: true, grid: { ...g01(), hidden: true, status: status(0), paging: paging(0) } } }),
  };
  const LABELS = {
    '01-users-grid': 'Users grid', '02-columns-panel': 'Columns panel', '03-attribute-filter': 'Attribute filter', '04-user-details': 'User details',
    '05-user-details-edit': 'Edit attribute values', '06-in-grid-pending': 'In-grid pending changes', '07-bulk-actions-menu': 'Bulk Actions menu',
    '08-set-attributes-dialog': 'Set attributes', '09-set-attributes-review': 'Review', '10-set-attributes-results': 'Results',
    '11-set-attributes-single-value': 'Single-value attribute', '12-details-saved': 'One change saved', '13-no-matches': 'No matches',
  };

  const frame = $('frame');
  let current = '01-users-grid';
  function renderSpec(s) {
    let main;
    if (s.page === 'details') main = detailsPage({ mode: s.mode, saved: s.saved });
    else main = usersPage(s.users);
    $('app').innerHTML = shell({ title: 'Users', main: main, ...(s.shell || {}) }) + (s.dialog ? s.dialog() : '');
    frame.classList.toggle('vp', !!s.vp);
    setNotches($('app'));
  }
  function switcher(open) {
    $('mock-panel').hidden = !open;
    $('mock-toggle').setAttribute('aria-expanded', String(open));
  }
  function show(name) {
    if (!STATES[name]) throw new Error(`unknown state ${name}`);
    current = name;
    window.scrollTo(0, 0);
    renderSpec(STATES[name]());
    $('mock-current').textContent = ` · ${name.slice(0, 2)} ${LABELS[name]}`;
    $('mock-panel').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.go === name)));
    switcher(false);
    if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
  }
  $('mock-panel').innerHTML = Object.keys(STATES).map((name) => `<button type="button" data-go="${name}">${name.slice(0, 2)} ${esc(LABELS[name])}</button>`).join('');
  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-go], [data-noop], #mock-toggle, a[href="#"]');
    if (!target) return;
    event.preventDefault();
    if (target.id === 'mock-toggle') { switcher($('mock-panel').hidden); return; }
    if (target.dataset.go) show(target.dataset.go);
  });
  window.addEventListener('hashchange', () => { const name = location.hash.slice(1); if (STATES[name] && name !== current) show(name); });
  // The calibration harness (work/cal) renders a Devices page from its own data through renderSpec.
  window.mockup = { STATES: Object.keys(STATES), show, renderSpec, parts: { shell, usersPage, grid } };
  const initial = location.hash.slice(1);
  show(STATES[initial] ? initial : '01-users-grid');
})();
</script>
</body>
</html>
