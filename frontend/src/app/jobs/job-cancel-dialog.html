@if (open()) {
<div class="picker-scrim" aria-hidden="true" (click)="cancelled.emit()"></div>
<div class="picker-wrap">
  <section
    class="picker"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="cancel-job-title"
    aria-describedby="cancel-question-one cancel-question-two"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown)="keydown($event)"
  >
    <h2 id="cancel-job-title">{{ question().title }}</h2>
    <div class="picker-content">
      <p id="cancel-question-one">{{ question().paragraphs[0] }}</p>
      <p id="cancel-question-two">{{ question().paragraphs[1] }}</p>
    </div>
    <div class="picker-actions">
      <button mat-button type="button" (click)="cancelled.emit()">
        {{ question().dismissLabel }}
      </button>
      <button
        mat-flat-button
        type="button"
        [disabled]="busy()"
        (click)="confirmed.emit()"
      >
        {{ question().confirmLabel }}
      </button>
    </div>
  </section>
</div>
}
