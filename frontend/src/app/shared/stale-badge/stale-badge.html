<p
  class="stale-badge flex flex-wrap items-center gap-md"
  aria-live="polite"
  aria-atomic="true"
>
  <time
    class="secondary"
    [attr.datetime]="observedAt()"
    [matTooltip]="observedAt() | date: 'medium'"
    matTooltipPosition="above"
    >Observed {{ relative() }}</time
  >
  @if (stale()) {
  <strong class="stale-badge-label">Stale observation</strong>
  }
  <button
    mat-stroked-button
    (click)="refresh.emit()"
    [disabled]="refreshing()"
    [attr.aria-busy]="refreshing()"
  >
    Refresh
  </button>
</p>
